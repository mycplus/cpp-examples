name: memory-management

on:
  push:
    paths: ['memory/memory-management/**', '.github/workflows/memory-management.yml']
  pull_request:
    paths: ['memory/memory-management/**', '.github/workflows/memory-management.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: memory/memory-management

jobs:
  linux:
    name: Linux ${{ matrix.cxx }} ${{ matrix.std }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        std: [c++17, c++20]
    steps:
      - uses: actions/checkout@v4
      - name: Build, run and compare with the article
        run: bash tests/run_tests.sh ${{ matrix.cxx }} ${{ matrix.std }}

  sanitizers:
    name: Sanitizers ${{ matrix.cxx }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Install the Clang sanitizer runtime
        if: matrix.cxx == 'clang++'
        run: sudo apt-get update && sudo apt-get install -y libclang-rt-18-dev
      - name: Correct examples clean, deliberate bugs reported
        run: bash tests/sanitizers.sh ${{ matrix.cxx }}

  macos:
    name: macOS Apple Clang
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with warnings as errors and compare the portable outputs
        run: |
          set -euo pipefail
          mkdir -p out
          for p in new_delete ownership exception_safety; do
            clang++ -std=c++17 -O2 -Wall -Wextra -pedantic -Werror -o "out/$p" "src/$p.cpp"
            "out/$p" 2>/dev/null | tr -d '\r' | diff - "tests/expected/$p.txt"
          done
          clang++ -std=c++17 -O2 -Wall -Wextra -pedantic -Werror -Wno-exceptions \
            -o out/throwing_destructor src/throwing_destructor.cpp
          out/throwing_destructor loose | tr -d '\r' | diff - tests/expected/throwing_destructor_loose.txt

  windows:
    name: Windows MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build with /W4 /WX and compare the portable outputs
        shell: pwsh
        # PowerShell rather than Git Bash: Git's /usr/bin/link can shadow MSVC's link.exe.
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          function Compare-Output($exe, $arg, $expected) {
            $got  = (& $exe $arg 2>$null) -join "`n"
            $want = (Get-Content $expected) -join "`n"
            if ($got -ne $want) { Write-Output "MISMATCH $exe`n--- got`n$got`n--- want`n$want"; exit 1 }
            Write-Output "PASS  $exe $arg"
          }
          foreach ($p in 'new_delete', 'ownership', 'exception_safety') {
            cl /nologo /std:c++17 /EHsc /O2 /W4 /WX "/Fe:out\$p.exe" "src\$p.cpp" | Out-Null
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Compare-Output "out\$p.exe" $null "tests\expected\$p.txt"
          }
          cl /nologo /std:c++17 /EHsc /O2 /W4 /WX /wd4297 "/Fe:out\throwing_destructor.exe" src\throwing_destructor.cpp | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compare-Output "out\throwing_destructor.exe" "loose" "tests\expected\throwing_destructor_loose.txt"
